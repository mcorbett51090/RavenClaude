<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Regular Reference Co.</title>
    <style>
      :root {
        --color-primary: #0055ff;
        --color-accent: #ff5500;
        --space-2: 8px;
      }
      body {
        margin: 0;
        padding: 16px;
        font-size: 16px;
        color: #222;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        font-size: 39px;
        margin: 32px 0;
      }
      h2 {
        font-size: 31px;
        margin: 24px 0;
      }
      h3 {
        font-size: 25px;
        margin: 16px 0;
      }
      h4 {
        font-size: 20px;
      }
      .stack {
        gap: 8px;
      }
      .stack-lg {
        gap: 48px;
      }
      .btn {
        padding: 8px 16px;
        border-radius: 8px;
        background: #0055ff;
        color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .card {
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .card--raised {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }
      nav {
        display: flex;
        gap: 16px;
        padding: 16px;
      }
      .field {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
      @media (min-width: 768px) {
        .container {
          padding: 32px;
        }
      }
      @media (min-width: 1024px) {
        .container {
          padding: 48px;
        }
      }
    </style>
  </head>
  <body>
    <nav>Home About Contact</nav>
    <div class="container">
      <h1>Regular Reference</h1>
      <button class="btn">Go</button>
      <div class="card">A card</div>
      <input class="field" />
    </div>
  </body>
</html>
