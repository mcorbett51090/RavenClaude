# Thing harden-transform registry (v1) — AppSec-signed; change control = catalog bar.
# Seat proposes; this registry verifies. Adding a transform requires AppSec review.
schema_version: 1
registry_version: "1"
# Feature flag default ON after AppSec enable GO (2026-09-16); set false to opt out — see command_review.hardening_edit / templates/thing.yaml.
transforms:
  - id: git-force-with-lease
    name: git push --force → --force-with-lease
    rationale: >
      Force-with-lease refuses to clobber unseen remote work; clears srm.force-push
      / xc.no-undo triggers while preserving push intent. Hard-rule / pre_llm floor
      still DENYs force-push (transform does not clear §B.9.3 to ASK).
    appsec: SIGNED
    fixtures:
      - original: "git push --force origin feat/x"
        revised: "git push --force-with-lease origin feat/x"
      - original: "git push -f origin feat/x"
        revised: "git push --force-with-lease origin feat/x"

  - id: git-clean-dry-run
    name: git clean -fd[x] → add -n dry-run
    rationale: >
      Dry-run previews deletions; no match when -n/-i already present.
    appsec: SIGNED
    fixtures:
      - original: "git clean -fdx"
        revised: "git clean -n -fdx"
      - original: "git clean -fd"
        revised: "git clean -n -fd"

  - id: curl-add-fail
    name: curl HTTP(S) GET/HEAD → add --fail
    rationale: >
      Fail-fast on HTTP errors. Never --spider. Never on POST/PUT/PATCH/DELETE.
      Only when --fail/--fail-with-body missing.
    appsec: SIGNED
    fixtures:
      - original: "curl https://example.com/x"
        revised: "curl --fail https://example.com/x"

  - id: wget-add-fail
    name: wget fail-fast (gated — no match without proven tier descent)
    rationale: >
      wget has no curl-equivalent --fail. v1 matchers return no-match unless a
      documented fail-fast flag would prove rank(tier(rev)) < gate_floor; otherwise ask.
      Never --spider on mutating methods.
    appsec: SIGNED
    fixtures: []

  - id: chmod-no-world-write
    name: chmod world-writable → u+rwX,go+rX (path-bound)
    rationale: >
      Removes world-writable modes. Path required; reject /, root globs, and
      system paths under /etc /usr /bin /sbin /boot /dev /proc /sys.
    appsec: SIGNED
    fixtures:
      - original: "chmod 777 ./out"
        revised: "chmod u+rwX,go+rX -- ./out"
      - original: "chmod -R 777 ./out"
        revised: "chmod -R u+rwX,go+rX -- ./out"

  - id: npm-drop-global
    name: npm/pnpm/yarn install -g → drop -g/--global
    rationale: >
      Global installs widen blast radius; local install preserves package intent.
    appsec: SIGNED
    fixtures:
      - original: "npm install -g left-pad@1.3.0"
        revised: "npm install left-pad@1.3.0"
      - original: "pnpm install --global foo@1.0.0"
        revised: "pnpm install foo@1.0.0"
