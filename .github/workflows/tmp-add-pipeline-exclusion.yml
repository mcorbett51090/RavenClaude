# TEMPORARY one-off maintenance workflow — generic by design: the hook name and
# its reason arrive as dispatch-time inputs. It lists one registered hook in the
# dashboard generator's _PIPELINE_EXCLUDED_HOOKS map (the Gate 133 contract: every
# registered hook is either a Pipeline stage or excluded WITH a reason), verifies
# the result with that gate's own checker on the runner, and commits only if the
# file changed. Dispatched once against a PR branch, then deleted in the
# following commit. The edit is idempotent: an already-listed hook is a no-op.
name: tmp-add-pipeline-exclusion

on:
  workflow_dispatch:
    inputs:
      hook:
        description: "Hook basename to list in _PIPELINE_EXCLUDED_HOOKS (e.g. some-hook.sh)"
        required: true
        type: string
      reason:
        description: "One-line reason the hook is deliberately not a Pipeline stage card"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-exclusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Insert the entry (idempotent), verify with the gate's own checker, commit only if changed
        env:
          HOOK_NAME: ${{ inputs.hook }}
          HOOK_REASON: ${{ inputs.reason }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, textwrap
          p = pathlib.Path("scripts/generate-dashboards.py")
          src = p.read_text(encoding="utf-8")
          name = os.environ["HOOK_NAME"].strip()
          reason = " ".join(os.environ["HOOK_REASON"].split())
          if not re.fullmatch(r"[A-Za-z0-9._-]+\.sh", name):
              raise SystemExit(f"refusing: hook name {name!r} is not a plain basename")
          if f'"{name}":' in src:
              print(f"already present: {name}")
              raise SystemExit(0)
          anchor = "_PIPELINE_EXCLUDED_HOOKS = {\n"
          i = src.index(anchor) + len(anchor)
          # Same implicit-concatenation shape as the existing entries, wrapped so
          # the file stays within the repo's ruff line length.
          pieces = textwrap.wrap(reason, width=84, break_long_words=False, break_on_hyphens=False)
          lines = [f'    {json.dumps(name)}: {json.dumps(pieces[0] + " ")}']
          for piece in pieces[1:-1]:
              lines.append(f'    {json.dumps(piece + " ")}')
          if len(pieces) > 1:
              lines.append(f'    {json.dumps(pieces[-1])}')
          lines[-1] += ","
          entry = "\n".join(lines) + "\n"
          p.write_text(src[:i] + entry + src[i:], encoding="utf-8")
          print("inserted:\n" + entry)
          PY
          python3 -m py_compile scripts/generate-dashboards.py
          python3 scripts/check-pipeline-lanes.py
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change needed."
          else
            git add scripts/generate-dashboards.py
            git commit -m "chore(dashboards): list ${HOOK_NAME} in _PIPELINE_EXCLUDED_HOOKS via one-off maintenance workflow"
            git push origin "HEAD:${TARGET_REF}"
          fi
