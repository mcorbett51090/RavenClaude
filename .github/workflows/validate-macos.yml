name: Validate macOS

# WHY THIS WORKFLOW EXISTS
# -----------------------
# Eight stock-macOS defects shipped and stayed GREEN in CI for months, because every
# other workflow runs on ubuntu — bash 5 + coreutils + GNU grep/sed — where all eight
# are invisible: bash 3.2 (`shopt globstar`, `declare -A`), absent `timeout`, BSD `grep`
# (no -P), BSD `sed -i`, a linux_amd64-hardcoded actionlint, `mktemp --suffix=`, and
# PEP-604 annotations on py3.9. `bash -n` cannot catch any of them (valid syntax, runtime
# failure, conditional paths), and a static linter cannot either — several are an ABSENT
# BINARY or a FLAG difference, not bash constructs. The only thing that catches this class
# is EXECUTING the hooks on a real stock-macOS toolchain. That is this workflow's job.
#
# COST: macOS runners bill at 10x ubuntu minutes, so this is paths-filtered to the shell
# surface it protects. It is NOT part of validate-marketplace.

on:
  pull_request:
    paths:
      - "plugins/**/hooks/**"
      - "scripts/check-macos-portability.sh"
      - ".github/workflows/validate-macos.yml"
      # door 5: the extensionless entry points. Without these, a change to the
      # installer could not trigger the ONE workflow that parses it under bash 3.2 —
      # which is exactly how PR #828 shipped an unparseable scripts/ravenclaude.
      - "scripts/ravenclaude"
      - "plugins/*/bin/rc"
  push:
    branches:
      - main
    paths:
      - "plugins/**/hooks/**"
      - "scripts/check-macos-portability.sh"
      - ".github/workflows/validate-macos.yml"
      # door 5: the extensionless entry points. Without these, a change to the
      # installer could not trigger the ONE workflow that parses it under bash 3.2 —
      # which is exactly how PR #828 shipped an unparseable scripts/ravenclaude.
      - "scripts/ravenclaude"
      - "plugins/*/bin/rc"
  # ⛔ THE SUITE LANE NEEDS AN UNFILTERED TRIGGER, AND THIS IS WHY.
  # The `paths:` filters above are correct for the two hook jobs — they protect a
  # named shell surface. They are the WRONG shape for `audit-gates.sh`, which is a
  # WHOLE-TREE reader (AGENTS.md: "An allow-list that fails open is the wrong shape
  # for a whole-tree validator"). A macOS-only break in scripts/*.py or a generator
  # would never match these globs, so a paths-filtered suite would rebuild the exact
  # blind spot it exists to close.
  # A `schedule` trigger carries NO paths filter, so the suite runs over the whole
  # tree nightly regardless of what changed. Nightly (not per-PR) is the deliberate
  # cost trade: macOS bills at 10x, and per-PR would be ~10x the spend of this lane.
  # It cannot block a bad PR — but the status quo catches this class NEVER, and a
  # <24h signal naming the merge that broke it is the large step. To promote to
  # per-merge, add `push: branches: [main]` with no paths; to per-PR, drop the
  # paths filters above. Both are one-line owner decisions, not code changes.
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily — off the hour to dodge scheduler spikes
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo to validate it.
permissions:
  contents: read

jobs:
  macos-portability:
    name: Hooks run on a stock macOS toolchain (bash 3.2 / no coreutils / BSD grep)
    runs-on: macos-latest
    steps:
      # NOTE: the fail-closed audit runs on BOTH platforms — see the
      # `hook-failclosed` job below. A hook that fails closed on Linux and open
      # on macOS is precisely how the original doors hid, so asserting identical
      # outcomes across the two IS the check; a single-platform run would be
      # a coin-flip dressed as a gate.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 2, not the default 1 — this job runs audit-gates.sh, whose base-diffing
          # gates need HEAD^1 on a push to main. See the fuller note (and the
          # depth-1-vs-depth-2 clone control) in validate-marketplace.yml.
          fetch-depth: 2
          persist-credentials: false

      # Recorded so a future image change is visible in the log rather than inferred from
      # a mystery failure. The gate itself ASSERTS these and fails red if the baseline
      # moves — a runner that quietly gains bash 4 would stop testing what it claims to.
      - name: Record the toolchain baseline
        run: |
          echo "uname:      $(uname -s) $(uname -r)"
          echo "/bin/bash:  $(/bin/bash --version | head -1)"
          echo "timeout:    $(command -v timeout || echo 'absent (expected on stock macOS)')"
          echo "grep -P:    $(printf x | /usr/bin/grep -P x >/dev/null 2>&1 && echo 'present (UNEXPECTED)' || echo 'absent (expected — BSD grep)')"
          echo "perl:       $(command -v perl || echo 'ABSENT — the portability shim needs this')"

      # Runs the real hooks under `env -i PATH=/usr/bin:/bin` with /bin/bash, and carries
      # a must-fail half per door (re-introduce the defect, assert we catch it). Exits
      # non-zero if any stock-macOS door is open.
      - name: Prove every macOS door is closed
        run: bash scripts/check-macos-portability.sh

  hook-failclosed:
    # The SAME audit on BOTH platforms. A guardrail that fails closed on one and
    # open on the other is exactly how the stock-macOS doors survived eighteen
    # commits — so a platform divergence in the outcome is itself the finding,
    # and a single-OS run could not see it.
    name: Every PreToolUse hook fails closed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 2, not the default 1 — this job runs audit-gates.sh, whose base-diffing
          # gates need HEAD^1 on a push to main. See the fuller note (and the
          # depth-1-vs-depth-2 clone control) in validate-marketplace.yml.
          fetch-depth: 2
          persist-credentials: false

      - name: Drive every PreToolUse hook with input it was never written for
        # Asserts the exit is 0 (safe no-op) or 2 (deny) and never 1 — the
        # harness treats any non-2 non-zero as a NON-blocking error, so an
        # errored guard fails OPEN. Runs each hook under `env -i PATH=/usr/bin:/bin`
        # against a throwaway project dir, time-bounded, so nothing touches the
        # real tree. --self-test additionally proves the runner's own teeth.
        run: |
          bash scripts/check-hook-failclosed.sh --self-test

      - name: Static — no permissive verdict default, no late-armed EXIT trap
        # The two fail-open shapes execution cannot reach, because they fire only
        # on a branch a synthetic payload does not take.
        run: |
          python3 scripts/check-verdict-default-nonpermissive.py --self-test
          python3 scripts/check-verdict-default-nonpermissive.py

  audit-gates-macos:
    name: Every gate passes on a stock macOS toolchain
    runs-on: macos-latest
    # WHY THIS JOB EXISTS (measured 2026-08-17, not hypothetical):
    # Gates 213/215 shipped GREEN in CI and RED for every developer inside VS Code.
    # The tests read the ambient host-detection surface (TERM_PROGRAM and ten
    # siblings), so `TERM_PROGRAM` unset -> pass, `=vscode` -> fail. CI never saw it
    # because audit-gates.sh runs ONLY in validate-marketplace.yml on ubuntu-latest;
    # this workflow ran portability + hook-failclosed, never the suite. Three
    # assertions were red on main for days with every check reporting SUCCESS.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 2, not the default 1 — this job runs audit-gates.sh, whose base-diffing
          # gates need HEAD^1 on a push to main. See the fuller note (and the
          # depth-1-vs-depth-2 clone control) in validate-marketplace.yml.
          fetch-depth: 2
          persist-credentials: false

      - name: Record the toolchain baseline
        # The suite's verdict is only meaningful against a KNOWN toolchain — print it
        # so a future failure can be attributed to the runner rather than guessed at.
        run: |
          echo "uname:  $(uname -s) $(uname -r)"
          echo "bash:   $(/bin/bash --version | head -1)"
          echo "python: $(python3 --version)"
          command -v timeout >/dev/null 2>&1 && echo "timeout: present" || echo "timeout: ABSENT (expected on stock macOS)"

      - name: Set up Node.js
        # The render/round-trip *.mjs gates run under node/npx, and audit-gates.sh
        # HARD-FAILS in CI when node/npx is absent (a skip is not a pass).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install ruff (audit-gates Gate 9b)
        # Same pin as validate-marketplace.yml. `python3 -m pip`, never bare `pip`:
        # bare pip is command-not-found on a stock macOS toolchain.
        # ⛔ TWO DIFFERENT FAILURE MODES, so try plain THEN the PEP-668 escape:
        # a Homebrew/externally-managed python REFUSES a plain install and needs
        # --break-system-packages, while an older pip (21.2.4 ships with the stock
        # CommandLineTools python 3.9) REJECTS that flag outright with exit 2
        # (measured 2026-08-17). Neither form alone is safe across runner images.
        run: |
          python3 -m pip install --quiet 'ruff==0.15.8' \
            || python3 -m pip install --quiet --break-system-packages 'ruff==0.15.8'

      - name: Install the Python deps the ubuntu image happens to preinstall
        # ⛔ THIS STEP IS THE WHOLE POINT OF THE JOB, MEASURED 2026-08-17.
        # validate-marketplace.yml never installs PyYAML because the ubuntu runner
        # image ships it. macos-latest does not — so the FIRST run of this job came
        # back 668 pass / 141 fail with 98x "ModuleNotFoundError: No module named
        # 'yaml'" (the tribunal's concern-catalog parser). Not a code defect: an
        # environment asymmetry that ubuntu-only CI can never surface.
        #   pyyaml     - concerns-catalog parsing (98 failures without it)
        #   jsonschema - Gate 47 validate-schemas fixtures
        #   tomli      - the Codex sandbox reader; stdlib tomllib is 3.11+ only, so
        #                an older runner python needs the backport
        # Same plain-then-PEP-668 fallback as the ruff step above.
        run: |
          python3 -m pip install --quiet pyyaml jsonschema tomli \
            || python3 -m pip install --quiet --break-system-packages pyyaml jsonschema tomli
          python3 -c 'import yaml, jsonschema; print("yaml", yaml.__version__)'

      - name: Audit every gate on macOS
        # Same command validate-marketplace.yml runs on ubuntu. The POINT is the
        # runner, not the command: bash 3.2, BSD grep/sed, absent GNU timeout.
        run: scripts/audit-gates.sh
