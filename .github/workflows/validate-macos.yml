name: Validate macOS

# WHY THIS WORKFLOW EXISTS
# -----------------------
# Eight stock-macOS defects shipped and stayed GREEN in CI for months, because every
# other workflow runs on ubuntu — bash 5 + coreutils + GNU grep/sed — where all eight
# are invisible: bash 3.2 (`shopt globstar`, `declare -A`), absent `timeout`, BSD `grep`
# (no -P), BSD `sed -i`, a linux_amd64-hardcoded actionlint, `mktemp --suffix=`, and
# PEP-604 annotations on py3.9. `bash -n` cannot catch any of them (valid syntax, runtime
# failure, conditional paths), and a static linter cannot either — several are an ABSENT
# BINARY or a FLAG difference, not bash constructs. The only thing that catches this class
# is EXECUTING the hooks on a real stock-macOS toolchain. That is this workflow's job.
#
# COST: macOS runners bill at 10x ubuntu minutes, so this is paths-filtered to the shell
# surface it protects. It is NOT part of validate-marketplace.

on:
  pull_request:
    paths:
      - "plugins/**/hooks/**"
      - "scripts/check-macos-portability.sh"
      - ".github/workflows/validate-macos.yml"
      # door 5: the extensionless entry points. Without these, a change to the
      # installer could not trigger the ONE workflow that parses it under bash 3.2 —
      # which is exactly how PR #828 shipped an unparseable scripts/ravenclaude.
      - "scripts/ravenclaude"
      - "plugins/*/bin/rc"
  push:
    branches:
      - main
    paths:
      - "plugins/**/hooks/**"
      - "scripts/check-macos-portability.sh"
      - ".github/workflows/validate-macos.yml"
      # door 5: the extensionless entry points. Without these, a change to the
      # installer could not trigger the ONE workflow that parses it under bash 3.2 —
      # which is exactly how PR #828 shipped an unparseable scripts/ravenclaude.
      - "scripts/ravenclaude"
      - "plugins/*/bin/rc"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo to validate it.
permissions:
  contents: read

jobs:
  macos-portability:
    name: Hooks run on a stock macOS toolchain (bash 3.2 / no coreutils / BSD grep)
    runs-on: macos-latest
    steps:
      # NOTE: the fail-closed audit runs on BOTH platforms — see the
      # `hook-failclosed` job below. A hook that fails closed on Linux and open
      # on macOS is precisely how the original doors hid, so asserting identical
      # outcomes across the two IS the check; a single-platform run would be
      # a coin-flip dressed as a gate.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Recorded so a future image change is visible in the log rather than inferred from
      # a mystery failure. The gate itself ASSERTS these and fails red if the baseline
      # moves — a runner that quietly gains bash 4 would stop testing what it claims to.
      - name: Record the toolchain baseline
        run: |
          echo "uname:      $(uname -s) $(uname -r)"
          echo "/bin/bash:  $(/bin/bash --version | head -1)"
          echo "timeout:    $(command -v timeout || echo 'absent (expected on stock macOS)')"
          echo "grep -P:    $(printf x | /usr/bin/grep -P x >/dev/null 2>&1 && echo 'present (UNEXPECTED)' || echo 'absent (expected — BSD grep)')"
          echo "perl:       $(command -v perl || echo 'ABSENT — the portability shim needs this')"

      # Runs the real hooks under `env -i PATH=/usr/bin:/bin` with /bin/bash, and carries
      # a must-fail half per door (re-introduce the defect, assert we catch it). Exits
      # non-zero if any stock-macOS door is open.
      - name: Prove every macOS door is closed
        run: bash scripts/check-macos-portability.sh

  hook-failclosed:
    # The SAME audit on BOTH platforms. A guardrail that fails closed on one and
    # open on the other is exactly how the stock-macOS doors survived eighteen
    # commits — so a platform divergence in the outcome is itself the finding,
    # and a single-OS run could not see it.
    name: Every PreToolUse hook fails closed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Drive every PreToolUse hook with input it was never written for
        # Asserts the exit is 0 (safe no-op) or 2 (deny) and never 1 — the
        # harness treats any non-2 non-zero as a NON-blocking error, so an
        # errored guard fails OPEN. Runs each hook under `env -i PATH=/usr/bin:/bin`
        # against a throwaway project dir, time-bounded, so nothing touches the
        # real tree. --self-test additionally proves the runner's own teeth.
        run: |
          bash scripts/check-hook-failclosed.sh --self-test

      - name: Static — no permissive verdict default, no late-armed EXIT trap
        # The two fail-open shapes execution cannot reach, because they fire only
        # on a branch a synthetic payload does not take.
        run: |
          python3 scripts/check-verdict-default-nonpermissive.py --self-test
          python3 scripts/check-verdict-default-nonpermissive.py
