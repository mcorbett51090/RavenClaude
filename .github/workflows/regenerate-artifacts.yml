name: Regenerate generated artifacts (post-merge self-heal)

# Why this exists
# ---------------
# Several repo-wide *generated* artifacts change on almost every plugin add/bump:
# the marketplace-claims derivable counts, the
# concept/decision-tree SVGs, and dashboard.html (which inlines those SVGs). When
# multiple plugin PRs are open at once, each one regenerating these into its own
# branch guarantees (a) merge conflicts on the big files and (b) "freshness gate"
# failures on whichever branch goes stale as siblings merge — the cross-PR
# contagion that turned "working on multiple things at once" into "tons of CI
# failing". Rendering the SVGs additionally needs mermaid-cli + Chromium, which
# most authors don't have locally (the "author forgot to render" failure class).
#
# The fix: take all of these OFF the PR critical path and let `main` OWN them.
# PR branches no longer regenerate them (the regen-on-manifest-change.sh hook skips
# dashboard when this workflow is present; the SVG/dashboard/count PR
# gates are removed), and after each merge this workflow regenerates everything once
# and commits the result back. So `main` (what GitHub Pages serves) is always fresh
# within ~a minute of a merge, and none of these is ever a source of PR conflicts.
# The render-test gates that consume dashboard.html stay honest because audit-gates.sh
# regenerates dashboard.html in place before running them (generate-then-test).
#
# Scope: marketplace-claims counts, concepts.json (the Learn-tab registry), concept
# + decision-tree SVGs, dashboard.html (full plugin artifact), index.html (the
# unified portal — folds the dashboard + catalog in natively), the per-plugin BI
# report.html, the Copilot package, the Problems & Resolutions feedback-report.html
# (scenario corpus), and the Learn-tab docs/concepts.md. Each step is staleness-gated
# (--check), so a merge that changed none of them is a fast no-op (and never even
# loads mermaid-cli).
#
# concepts.json + report.html were ADDED to this self-heal on 2026-06-08: their
# freshness gates were still running at PR time in audit-gates (unlike dashboard/
# SVG/count, which had been relocated here), so a sibling merge that staled them
# failed every unrelated open PR — the exact cross-PR contagion this workflow exists
# to kill. Their PR-time "clean tree" gates were removed in the same change.
#
# feedback-report.html + docs/concepts.md were ADDED 2026-06-14 for the same reason:
# both carry a freshness gate that runs at PR time (audit-gates Gate 99 for the
# feedback report; a direct generate-concepts-doc.py --check in validate-marketplace
# for the concept doc) but had no regen step here, so a sibling scenario/concept merge
# could stale them and fail every open PR with nothing on main to heal it. Unlike the
# 2026-06-08 pair, their PR-time gates are KEPT (the artifacts are small and the gate
# doubles as a teeth check); the self-heal simply guarantees main returns to fresh.

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
      - "plugins/**"
      - "README.md"
      - "scripts/generate-dashboards.py"
      - "scripts/generate-index-dashboard.py"
      - "scripts/_index_dashboard_template.py"
      - "scripts/_html_merge.py"
      - "scripts/concepts.py"
      - "scripts/render-concepts.py"
      - "scripts/render-trees.py"
      - "scripts/generate-bi-report.py"
      - "scripts/generate-copilot-plugin.py"
      - "scripts/generate-feedback-report.py"
      - "scripts/generate-concepts-doc.py"
      - "scripts/check-marketplace-claims.py"
      - ".github/workflows/regenerate-artifacts.yml"
  workflow_dispatch:

# The job opens a PR with the regenerated artifacts (main is protected — direct
# pushes are rejected by the "changes must be made through a pull request" ruleset),
# lets that PR run the main ruleset's REQUIRED status checks, then squash-merges it
# once they pass (0 approvals required). The self-heal PR used to carry [skip ci] and
# merge immediately — that broke on 2026-07-17 when 3 checks became REQUIRED: [skip ci]
# suppressed them so they stayed pending forever and a non-admin merge could never
# satisfy them (self-heal PRs #720/#754 were left open + closed unmerged, so main went
# UN-healed whenever there was real drift). Removing [skip ci] from the PR commit and
# waiting for green is the fix.
permissions:
  contents: write
  pull-requests: write

# Serialize runs so two quick merges can't race on the push.
concurrency:
  group: regenerate-artifacts
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate generated artifacts on main
    runs-on: ubuntu-latest
    # Backstop for the "wait for the self-heal PR's checks" step below: the required
    # checks run ~3-4 min, so 25 min is generous headroom while still bounding a hang.
    timeout-minutes: 25
    steps:
      - name: Checkout (full history for accurate per-plugin "Last updated" dates)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      # setup-python installs a clean hostedtoolcache Python WITHOUT PyYAML
      # (unlike the runner's system python3, which ships with it — which is why
      # validate-marketplace.yml never hit this). scripts/concepts.py imports
      # yaml since the Learn-tab concepts work; without this install the
      # self-heal crashed on ModuleNotFoundError (4 consecutive runs, first
      # seen 2026-06-04).
      - name: Install Python deps for the generators
        run: python3 -m pip install --quiet pyyaml

      - name: Set up Node.js (mermaid-cli is fetched on demand by npx when an SVG is stale)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # A stale decision-tree / concept SVG needs mermaid-cli, which launches Chromium via
      # puppeteer. The puppeteer-downloaded chrome-headless-shell CANNOT launch on the runner —
      # its system shared libraries are absent (`chrome-headless-shell: error while loading
      # shared libraries: libglib-2.0.so.0: cannot open shared object file`), so every SVG render
      # silently failed + reverted (2026-07-27 diagnosis; the `--no-sandbox` puppeteer config the
      # render scripts already pass was never the issue). Fix: when — and ONLY when — a diagram is
      # actually stale, install a real Chrome WITH its system deps and point puppeteer at it. The
      # staleness gate preserves this workflow's fast-no-op design (a no-diagram merge never touches
      # Chrome). `render-*.py --check` reads a source-hash manifest (no browser), so it is cheap.
      - name: Detect whether any diagram needs rendering
        id: diagrams
        run: |
          set -euo pipefail
          if python3 scripts/render-concepts.py --check >/dev/null 2>&1 \
            && python3 scripts/render-trees.py --check >/dev/null 2>&1; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Install ONLY Chromium's system shared libraries — do NOT override the browser. mermaid-cli
      # bundles a puppeteer that downloads its OWN version-matched chrome-headless-shell; pointing it
      # at a newer stand-alone Chrome launches but then fails inside mermaid.js at render time
      # (`renderMermaid → fromText`, a CDP/version mismatch — observed 2026-07-27). So we let
      # mermaid-cli use its bundled, version-matched browser and just give it the libs it was missing
      # (the exact 24.04 set that a proven Chrome install pulls; `libglib2.0-0t64` provides the
      # `libglib-2.0.so.0` that was the first missing lib). Passwordless sudo is available on
      # GitHub-hosted runners. Gated on staleness so a no-diagram merge never touches apt.
      - name: Install Chromium system libraries for mermaid-cli (only when a diagram is stale)
        if: steps.diagrams.outputs.stale == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Chromium's shared libs (libglib2.0-0t64 provides the libglib-2.0.so.0 that was the first
          # missing lib) PLUS fonts: mermaid measures text geometry at render time, and a fresh runner
          # with no fonts makes that fail INSIDE mermaid.js (`renderMermaid → fromText`) even though the
          # browser launches — the second, non-Chrome cause observed 2026-07-27. fonts-liberation +
          # fontconfig give it a usable sans family.
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcairo2 libcups2t64 \
            libdbus-1-3 libexpat1 libgbm1 libglib2.0-0t64 libnss3 libpango-1.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 \
            fonts-liberation fontconfig

      - name: Self-heal generated artifacts (counts, SVGs, dashboard, index portal), commit if changed
        run: |
          set -euo pipefail

          # 1. Marketplace-claims DERIVABLE counts (per-plugin "<N> skills/agents"
          #    prose + README "ships **N plugins**"). --fix rewrites only the
          #    derivable digits in place (formatting-preserving, so prettier stays
          #    happy). It exits nonzero only if a STRUCTURAL problem remains — which
          #    the PR gate (--structural-only) should already have blocked, so a
          #    failure here is a loud signal, not silent drift.
          python3 scripts/check-marketplace-claims.py --fix

          # 1b. concepts.json — the Learn-tab concept REGISTRY parsed from the concept
          #     markdown source. Must be fresh BEFORE the SVGs + dashboard below (which
          #     embed concept data). Pure Python (no browser). This is audit-gates'
          #     "concepts.py freshness (clean tree)" gate relocated off the PR path.
          if ! python3 scripts/concepts.py --check >/dev/null 2>&1; then
            echo "concepts.json stale — regenerating from concept source."
            python3 scripts/concepts.py
            python3 scripts/concepts.py --check
          fi

          # 2. Concept + decision-tree SVGs. --check reads a source-hash manifest
          #    (no browser), so it is cheap; only when it reports STALE do we render,
          #    which DOES need mermaid-cli + Chromium (fetched on demand by npx via
          #    the render scripts). Staleness-gating means a merge that touched no
          #    diagram never loads mermaid at all.
          #
          #    A render failure is NON-FATAL (fixed 2026-06-08): one malformed diagram
          #    (or a flaky Chromium evaluate) must NOT abort the whole self-heal. That
          #    exact bug left main UN-HEALED across many merges — the job died here on
          #    a render-trees mermaid error before it ever reached the commit below, so
          #    concepts.json / report.html / dashboard / counts silently drifted and
          #    every open PR failed its freshness gate. On a render failure we keep the
          #    committed SVGs, emit a ::warning::, and CONTINUE the self-heal; a stale
          #    diagram surfaces as a warning instead of blocking everything else.
          # On a render FAILURE we `git checkout` the visuals dir: render-trees.py
          # wipes-then-renders (old.unlink()), so a mid-render failure leaves a
          # PARTIAL set — committing that would DELETE valid SVGs. Reverting the dir
          # restores the committed SVGs, so a failed render is a true no-op (stale
          # diagrams kept) rather than destructive.
          if ! python3 scripts/render-concepts.py --check >/dev/null 2>&1; then
            echo "concept SVGs stale — rendering with mermaid-cli."
            if ! python3 scripts/render-concepts.py; then
              echo "::warning::concept SVG render failed (mermaid) — reverting partial output, continuing self-heal"
              git checkout -- plugins/ravenclaude-core/knowledge/concepts/visuals 2>/dev/null || true
            fi
          fi
          if ! python3 scripts/render-trees.py --check >/dev/null 2>&1; then
            echo "decision-tree SVGs stale — rendering with mermaid-cli."
            if ! python3 scripts/render-trees.py; then
              echo "::warning::decision-tree SVG render failed (mermaid) — reverting partial output, continuing self-heal"
              git checkout -- plugins/ravenclaude-core/knowledge/tree-visuals 2>/dev/null || true
            fi
          fi

          # 3. dashboard.html — inlines the (now fresh) committed SVGs; pure Python,
          #    no mermaid needed here. Exact-byte freshness (the generator embeds no
          #    timestamps), so --check is an exact match. This is the dashboard
          #    "clean tree must_pass" relocated off PRs (audit-gates Gate 13).
          if ! python3 scripts/generate-dashboards.py --check >/dev/null 2>&1; then
            echo "dashboard.html stale — regenerating."
            python3 scripts/generate-dashboards.py
            python3 scripts/generate-dashboards.py --check
          fi

          # 4. index.html — the unified portal. It folds in the dashboard
          #    sub-app natively (via render_fragment) and inlines the per-plugin
          #    catalog data, so it must be regenerated AFTER the SVGs + dashboard
          #    above. --check
          #    strips the volatile generated-timestamp surfaces, so a pure
          #    timestamp delta reports fresh and we regenerate nothing.
          if ! python3 scripts/generate-index-dashboard.py --check >/dev/null 2>&1; then
            echo "index.html stale — regenerating the unified portal."
            python3 scripts/generate-index-dashboard.py
            python3 scripts/generate-index-dashboard.py --check
          fi

          # 4b. report.html — the per-plugin BI reports. Pure Python, independent of
          #     the dashboard. This is audit-gates' "bi-report freshness (clean tree)"
          #     gate relocated off the PR path.
          if ! python3 scripts/generate-bi-report.py --check >/dev/null 2>&1; then
            echo "report.html stale — regenerating BI reports."
            python3 scripts/generate-bi-report.py
            python3 scripts/generate-bi-report.py --check
          fi

          # 4c. Copilot package — mirrors plugin.json versions. Pure Python.
          if ! python3 scripts/generate-copilot-plugin.py --check >/dev/null 2>&1; then
            echo "copilot package stale — regenerating."
            python3 scripts/generate-copilot-plugin.py
          fi

          # 4d. feedback-report.html — the "Problems & Resolutions" report read from
          #     the scenario corpus (plugins/*/scenarios/*.md). Pure Python, no
          #     browser. Added to the self-heal 2026-06-13: it had been MISSING here,
          #     so a merge that added scenarios bumped the corpus counts without
          #     regenerating the report — the committed feedback-report.html silently
          #     drifted stale (366 vs 369 scenarios) and audit-gates Gate 99
          #     ("feedback-report freshness (clean tree)") went red in
          #     validate-marketplace for every subsequent PR. This is that gate
          #     relocated off the PR path, mirroring 4b/4c.
          if ! python3 scripts/generate-feedback-report.py --check >/dev/null 2>&1; then
            echo "feedback-report.html stale — regenerating from the scenario corpus."
            python3 scripts/generate-feedback-report.py
            python3 scripts/generate-feedback-report.py --check
          fi

          # 4e. docs/concepts.md — the Learn-tab concept doc derived from concepts.json
          #     (regenerated in step 1b above, so this must run AFTER it). Added to the
          #     self-heal 2026-06-14: it has BOTH an audit-gates clean-tree gate and a
          #     direct PR-time `generate-concepts-doc.py --check` in validate-marketplace,
          #     but no regen step here — the same latent contagion as 4d.
          if ! python3 scripts/generate-concepts-doc.py --check >/dev/null 2>&1; then
            echo "docs/concepts.md stale — regenerating from concepts.json."
            python3 scripts/generate-concepts-doc.py
            python3 scripts/generate-concepts-doc.py --check
          fi

          # 4f. Validate the regenerated artifacts BEFORE committing (added after the
          #     2026-07 three-panel review). This job pushes straight to main with
          #     [skip ci], so NO PR gate ever runs on what it commits — a generator that
          #     emitted non-prettier-conforming or structurally-invalid output would land
          #     on main un-checked and then fail EVERY subsequent PR's whole-tree
          #     `prettier --check .` / JSON-validity gate. We VALIDATE (never reformat —
          #     the HTML artifacts are exact-byte freshness-gated and .prettierignore'd)
          #     the files THIS job changed, and abort the push on any failure so the bad
          #     artifact is never the thing we self-heal onto main. Changed-files-only
          #     keeps this decoupled from unrelated pre-existing tree state.
          # --untracked-files=all so a wholly-new untracked directory (e.g. a brand-new
          # generated artifact tree like plugins/<name>/copilot/) is enumerated file-by-file
          # instead of collapsed to a single directory line — otherwise the `[[ -f ]]` guards
          # below skip every file inside it and BOTH the JSON and prettier gates silently
          # ignore a freshly-created artifact dir (Finding 22).
          mapfile -t _changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.{3}//' | sed -E 's/^.* -> //')
          if [[ ${#_changed[@]} -gt 0 ]]; then
            for f in "${_changed[@]}"; do
              [[ -f "$f" ]] || continue
              case "$f" in
                *.json)
                  python3 -m json.tool "$f" >/dev/null \
                    || { echo "::error::self-heal produced invalid JSON: $f — aborting push"; exit 1; } ;;
              esac
            done
            # prettier auto-skips .prettierignore'd files (the generated HTML) and *.md,
            # so this checks only the prettier-governed artifacts (concepts.json, the
            # copilot package JSON, marketplace/plugin manifests) the PR gate would check.
            _existing=()
            for f in "${_changed[@]}"; do [[ -f "$f" ]] && _existing+=("$f"); done
            if [[ ${#_existing[@]} -gt 0 ]]; then
              npx --yes prettier@3.9.4 --check --log-level warn "${_existing[@]}" \
                || { echo "::error::self-heal produced non-prettier-conforming output — aborting push (would break every subsequent PR's prettier gate)"; exit 1; }
            fi
          fi

          # 5. Report drift (informational). The changes are left UNCOMMITTED in the
          #    working tree; the create-pull-request step below commits them onto a
          #    bot branch and opens a PR. main is branch-protected (direct push is
          #    rejected), so a PR is the only route — see the two steps that follow.
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Artifacts already in sync — nothing to heal."
          else
            echo "Artifacts drifted — the following will be opened as a self-heal PR:"
            git status --porcelain
          fi

      # main is protected: direct `git push origin HEAD:main` is rejected by the
      # ruleset ("changes must be made through a pull request"). Open a PR from a
      # bot branch instead. No-ops silently when the tree is clean (no drift).
      - name: Open self-heal PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # LOAD-BEARING FIX (2026-07-27): open the PR with a PAT, not the default GITHUB_TOKEN.
          # A PR opened by GITHUB_TOKEN does NOT trigger `pull_request` workflows (GitHub
          # recursion-prevention), so the 3 REQUIRED checks never run on the bot PR — it sits
          # BLOCKED with "no checks reported" and the merge step below can never satisfy them
          # (this, NOT the [skip ci] that #759 removed, is why the self-heal failed every
          # real-drift run). A PR opened by a PAT (a real identity) DOES trigger the checks, so
          # they run + pass legitimately and the merge needs NO admin bypass. Falls back to
          # GITHUB_TOKEN when the secret is unset → same non-auto-merging behavior as before this
          # fix, so landing this workflow change is harmless until the secret exists.
          # Required SELF_HEAL_PAT scopes: fine-grained (Contents: Read/Write + Pull requests:
          # Read/Write on this repo) OR a classic PAT with `repo`. Owner-created; see the PR body.
          token: ${{ secrets.SELF_HEAL_PAT || github.token }}
          branch: chore/self-heal-artifacts
          base: main
          delete-branch: true
          commit-message: "chore(artifacts): self-heal generated artifacts after merge"
          title: "chore(artifacts): self-heal generated artifacts"
          body: |
            Automated post-merge self-heal of repo-wide **generated** artifacts
            (marketplace-claims counts, concept/decision-tree SVGs, `dashboard.html`,
            the `index.html` portal, BI reports, the Copilot package, the feedback
            report, `docs/concepts.md`).

            main is branch-protected, so this bot cannot push to it directly; it opens
            this PR, waits for the required status checks to pass, then squash-merges it
            (0 approvals required). Contents are deterministic generator output and were
            validated (JSON + prettier) before commit.
          labels: |
            automated
            generated-artifacts

      # The main ruleset REQUIRES 3 status checks (Validate manifests/layout/schemas).
      # Because the PR above is opened by SELF_HEAL_PAT (a real identity), those
      # `pull_request` checks now actually RUN on the bot PR — a GITHUB_TOKEN-opened PR
      # would never trigger them (the 2026-07-27 root cause). Wait for them to conclude,
      # then squash-merge — a token with contents+PR write merges the instant the required
      # checks are green (0 approvals, NO admin bypass — the checks genuinely pass). The
      # squash-merge SUBJECT keeps [skip ci] so landing on main does NOT re-trigger this
      # workflow (belt-and-suspenders — the artifacts are already fresh, so a re-run would
      # no-op anyway). A failing/incomplete check leaves the PR open for inspection rather
      # than force-landing un-validated output. (Without the secret, the fallback GITHUB_TOKEN
      # PR still won't get checks — same as before the fix — and this step leaves it open.)
      - name: Merge the self-heal PR once its required checks pass
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PAT || github.token }}
        run: |
          set -euo pipefail
          n="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Waiting for required checks on self-heal PR #$n (operation: ${{ steps.cpr.outputs.pull-request-operation }})"
          # Give the pull_request-triggered checks a moment to register before watching.
          sleep 25
          if ! gh pr checks "$n" --watch --interval 30; then
            echo "::error::self-heal PR #$n has a failing/incomplete required check — leaving it open for inspection"
            exit 1
          fi
          gh pr merge "$n" --squash --delete-branch \
            --subject "chore(artifacts): self-heal generated artifacts (#$n) [skip ci]"
