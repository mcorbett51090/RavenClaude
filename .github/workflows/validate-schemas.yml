name: Validate Schemas

on:
  # NO `paths:` filter on pull_request — this is a REQUIRED status check (ruleset
  # "main"), and GitHub leaves a path-skipped workflow's check Pending forever:
  # "A pull request that requires those checks to be successful will be blocked
  # from merging ... You should not use path or branch filtering to skip workflow
  # runs if the workflow is required to pass before merging."
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  #
  # The old filter (manifests + schemas/** only) meant most PRs skipped this —
  # docs-only PRs like the external-intake bot's would have hung permanently once
  # it became required. The job is ~33s, so running it on every PR is cheaper than
  # any conditional worth maintaining. Do NOT re-add `paths:` here; gate individual
  # STEPS with `if:` instead (a skipped job reports Success; a skipped workflow
  # reports nothing).
  #
  # The `push:` filter below is deliberately KEPT — push runs are not required
  # checks, so a path-skipped push run blocks nothing.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".claude-plugin/marketplace.json"
      - "plugins/*/.claude-plugin/plugin.json"
      - "schemas/**"
      - ".github/workflows/validate-schemas.yml"
  workflow_dispatch:

# Supersede in-flight runs for the same ref. Measured 2026-08-24: 35 of 1,000
# sampled RavenClaude runs (9% of compute) were still running when a newer push
# to the same branch started. Safe here — this workflow only READS the repo.
# Same shape as validate-macos.yml. Do NOT add `paths:` to pull_request (this
# is a required check — a skipped workflow hangs the PR forever).
concurrency:
  group: validate-schemas-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo to validate it.
permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin and marketplace JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      # Pinned. The previous unpinned install re-resolved latest on every run.
      # 4.26.0 is the release `pip index versions jsonschema` reported on 2026-11-05.
      - name: Install jsonschema
        run: python3 -m pip install --quiet 'jsonschema==4.26.0'

      # One process, one schema compile. The old loop spawned python3 -m jsonschema
      # once per plugin.json (29s of a 51s job on run 40728535976, 2026-10-28).
      - name: Validate plugin and marketplace manifests
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          from jsonschema.validators import validator_for

          def check(schema_path: str, instances: list[Path]) -> bool:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              validator_cls = validator_for(schema)
              validator_cls.check_schema(schema)
              validator = validator_cls(schema)
              failed = False
              for path in instances:
                  instance = json.loads(path.read_text(encoding="utf-8"))
                  errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
                  if not errors:
                      print(f"OK  {path}")
                      continue
                  failed = True
                  for err in errors:
                      loc = "/".join(str(part) for part in err.absolute_path) or "<root>"
                      print(f"::error file={path}::{loc}: {err.message}")
              return failed

          plugins = sorted(Path("plugins").glob("*/.claude-plugin/plugin.json"))
          if not plugins:
              print("::error::no plugin.json files found — refusing to report success")
              sys.exit(1)
          bad = check("schemas/plugin.schema.json", plugins)
          bad = check("schemas/marketplace.schema.json", [Path(".claude-plugin/marketplace.json")]) or bad
          sys.exit(1 if bad else 0)
          PY
