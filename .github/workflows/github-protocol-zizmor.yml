# Dogfood of the P3 §1.1 / P4 catalog's named workflow-static-analysis gate
# (`zizmor`). actionlint already runs in validate-marketplace.yml; zizmor
# covers a different class (template injection, persist-credentials, over-broad
# permissions). No paths: filter on pull_request — this check is a candidate
# required status (Rule 5).
name: GitHub protocol — zizmor

on:
  pull_request:
  workflow_dispatch:

# Read-only. Cancel a superseded run on the same ref instead of letting it
# finish after the head has moved (same shape as validate-layout.yml).
concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Lint GitHub Actions (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false
          version: v1.29.0
          inputs: .github/workflows
