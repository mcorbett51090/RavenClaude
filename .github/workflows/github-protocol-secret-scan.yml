# Dogfood of templates/agent-ready-repo/github-protocol-secret-scan.yml.template
# (P3 §1.6 / P4 catalog — secret scan + push protection).
#
# The template still skips the scan on workflow_dispatch and exits 0, because a
# consumer scaffold has no PR to look up. This copy is a required check, so a
# dispatch must scan the open PR whose head is this SHA, or fail. A green
# no-op was the hole called out on 2026-10-03.
#
# Checkout is depth 1 of the head, then a deepen until the merge base is an
# ancestor. fetch-depth 0 (all branches, all history) was 106s of a 149s job
# on run 40728535994 (2026-10-28). A depth-20 fetch of a 4-commit PR tip on
# 2026-11-05 was a 40MB object store and included the merge base. The scanner
# image tag is pinned (the action SHA does not pin the image; the default is
# "latest").
name: GitHub protocol — secret scan

on:
  pull_request:
  workflow_dispatch:

# Read-only. Cancel a superseded run on the same ref.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secret-scan:
    name: Scan for committed secrets (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          REPO: ${{ github.repository }}
          THIS_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          sha_re = re.compile(r"^[0-9a-f]{40}$")
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              print("::error::repo is an unexpected shape")
              sys.exit(1)

          def api(path):
              url = path if path.startswith("http") else f"https://api.github.com{path}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ravenclaude-secret-scan",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          event = os.environ["EVENT_NAME"]
          commits = os.environ.get("PR_COMMITS") or "0"
          if event == "pull_request":
              base_tip = os.environ["BASE_SHA"]
              head = os.environ["HEAD_SHA"]
          else:
              sha = os.environ["THIS_SHA"]
              if not sha_re.match(sha):
                  print("::error::dispatch sha is not 40 hex")
                  sys.exit(1)
              pulls = api(f"/repos/{repo}/commits/{sha}/pulls?per_page=100")
              heads = [
                  p for p in pulls
                  if p.get("state") == "open" and (p.get("head") or {}).get("sha") == sha
              ]
              if not heads:
                  print(
                      f"::error::workflow_dispatch found no open PR whose head is {sha}. "
                      "Refusing to report success without a scan."
                  )
                  sys.exit(1)
              pr = heads[0]
              base_tip = (pr.get("base") or {}).get("sha") or ""
              head = (pr.get("head") or {}).get("sha") or ""
              # The list endpoint omits the commit count. One extra GET.
              number = pr.get("number")
              detail = api(f"/repos/{repo}/pulls/{number}")
              commits = str(detail.get("commits") or 0)

          if not (sha_re.match(base_tip) and sha_re.match(head)):
              print(f"::error::base or head sha is not 40 hex ({base_tip!r}, {head!r})")
              sys.exit(1)
          compared = api(f"/repos/{repo}/compare/{base_tip}...{head}")
          mb = ((compared.get("merge_base_commit") or {}).get("sha")) or ""
          if not sha_re.match(mb):
              print(f"::error::compare API returned no merge base ({mb!r})")
              sys.exit(1)
          try:
              commit_n = int(commits)
          except ValueError:
              commit_n = 0
          # Depth has to cover the PR commits plus the merge base. 20 extra
          # covers a merge commit or two. The fetch step deepens further if not.
          depth = max(commit_n + 20, 30)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"base={mb}\n")
              fh.write(f"head={head}\n")
              fh.write(f"depth={depth}\n")
              fh.write("skip=true\n" if mb == head else "skip=false\n")
          if mb == head:
              print(f"merge base equals head ({head}); no commits to scan")
          else:
              print(f"scan {mb}..{head} (initial depth {depth})")
          PY

      - name: Fetch commits up to the merge base
        if: steps.range.outputs.skip != 'true'
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          FETCH_DEPTH: ${{ steps.range.outputs.depth }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/${REPO}.git"
          # A second fetch with a larger --depth deepens an existing shallow
          # clone. Confirmed 2026-11-05: depth 15 lacked HEAD~80; depth 120
          # on the same clone contained it. --deepen was not the form tested.
          # FETCH_DEPTH, not DEPTH: shellcheck SC2153 treats DEPTH as a
          # misspelling of the depth variable assigned on the next line.
          depth="${FETCH_DEPTH}"
          git fetch --no-tags --depth="${depth}" "$url" "$HEAD_SHA"
          round=0
          while ! git merge-base --is-ancestor "$BASE" "$HEAD_SHA"; do
            round=$((round + 1))
            if [ "$round" -gt 4 ]; then
              echo "::error::merge base ${BASE} is not an ancestor of ${HEAD_SHA} after deepening"
              exit 1
            fi
            depth=$((depth + 400))
            git fetch --no-tags --depth="${depth}" "$url" "$HEAD_SHA"
          done
          echo "merge base ${BASE} is an ancestor of ${HEAD_SHA}"

      - name: TruffleHog secret scan
        if: steps.range.outputs.skip != 'true'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=verified,unknown
          # ghcr.io/trufflesecurity/trufflehog:v3.99.7 is not a tag (manifest
          # unknown, docker exit 125). The image tag for that release is 3.99.7.
          # Checked 2026-11-05: HEAD of that manifest returned 200; the v-prefixed
          # name returned 404. latest is 3.99.8 and is not pinned here.
          version: "3.99.7"
