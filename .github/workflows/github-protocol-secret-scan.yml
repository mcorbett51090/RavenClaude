# Dogfood of templates/agent-ready-repo/github-protocol-secret-scan.yml.template
# (P3 §1.6 / P4 catalog — secret scan + push protection). Diff-scoped TruffleHog
# on pull_request only. Native push protection is Settings-side and is not set here.
name: GitHub protocol — secret scan

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  secret-scan:
    name: Scan for committed secrets (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog secret scan (PR diff)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

      - name: Not a pull_request event — nothing to diff-scan
        if: github.event_name != 'pull_request'
        run: echo "Not a pull_request event (base/head empty) — diff-scoped secret scan skipped."
