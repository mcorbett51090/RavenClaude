########################################################################
# atlas-checks.yml — the harness atlas stays internally consistent.
#
# Runs when anything under the atlas directory changes: the data validates, the HTML pages
# and the markdown are exactly what the renderers write from the data, and the tool tests
# pass. It carries a `paths:` filter, which is only allowed because it is NOT a required
# check: AGENTS.md "Required status checks - never add paths: to a required workflow".
#
# ⛔ THIS WORKFLOW MUST NEVER BECOME A REQUIRED STATUS CHECK. With the path filter, a
# PR that touches nothing under the atlas would wait on it forever. The ruleset half is
# re-measured below on every run.
#
# The planted-error half of the audit (a gate must fail on a known-bad input) is the unit
# tests plus the explicit stale-pack step below: one stray character in a pack member
# must make `render_md.py --check` fail.
########################################################################
name: Atlas checks

on:
  pull_request:
    paths:
      - "docs/research/2026-10-04-coding-agent-harness-atlas/**"
      - ".github/workflows/atlas-checks.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/2026-10-04-coding-agent-harness-atlas/**"
      - ".github/workflows/atlas-checks.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: atlas-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    name: Atlas data validates, pages are current, tool tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/research/2026-10-04-coding-agent-harness-atlas/_tools
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Data validates
        run: python3 validate.py

      - name: HTML pages are what the renderer writes
        run: python3 render.py --check

      - name: Markdown is what the renderer writes
        run: python3 render_md.py --check

      - name: A stale pack member must FAIL the check (known-bad fixture)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/md"
          cp ../md/md.pack.json "$tmp/md/md.pack.json"
          python3 - "$tmp/md/md.pack.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          pack = json.loads(path.read_text(encoding="utf-8"))
          pack["register.md"] += "x"
          path.write_text(
              json.dumps(pack, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          if python3 render_md.py --check --out "$tmp/md"; then
            echo "::error::render_md.py --check accepted a stale pack member"
            exit 1
          fi
          echo "OK: the stale pack member was caught."

      - name: Tool tests
        run: python3 -m unittest discover -s tests

      # ── ⛔ RE-MEASURE THE RULESET CLAIM (see the header). Inconclusive is not OK.
      # Uses the DETAIL endpoint (list has no check contexts — CI-04).
      # working-directory overrides the job default (_tools/) so the repo-root
      # script is found.
      - name: Assert this workflow is NOT a required status check
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/assert-not-required-check.sh 'Atlas data validates'
